<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,html{
            height: 100%;
            width: 100%;
            background-color: black;
            color: white;
        }
        input{
            display: none;
        }
        #main{
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #btn{
            background-color: rgb(0, 83, 29);
            padding: 10px 8px;
            display: inline;
            border-radius: 10px ;
        }
        #main #btn:hover{
            scale: 0.95;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="main">
        <input type="file">
        <div id="btn">
            Upload File
        </div>
    </div>
    <script type="module" src="task2.js"></script>
</body>
</html>
