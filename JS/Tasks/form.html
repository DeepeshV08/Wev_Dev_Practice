<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f5f9;
}

.container{
    width:400px;
}

form{
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:16px;
    transition:.3s;
}

input:focus{
    border-color:#4a90e2;
}

small{
    display:block;
    color:red;
    margin-top:6px;
    font-size:14px;
    min-height:18px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4a90e2;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#357bd8;
}
</style>
</head>
<body>
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="form">

            <h2>Login Form</h2>

            <div class="input-box">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >
                <small id="emailError"></small>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
                <small id="passwordError"></small>
            </div>

            <button type="submit">
                Login
            </button>

        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
    <script type="module" src="form.js"></script>
</body>
</html>
